<figure class="mcp-diagram" tabindex="0" aria-label="Host, client, server and underlying system diagram"><svg viewBox="0 0 900 330" role="img" aria-labelledby="mcp-architecture-title mcp-architecture-desc"><title id="mcp-architecture-title">The application coordinates, the client connects, the server implements</title><desc id="mcp-architecture-desc">A host contains the user experience, model coordination and an MCP client. The client exchanges requests and results with an MCP server. The server validates access and uses an underlying data source or API. The user and model do not bypass these boundaries.</desc><defs><marker id="mcp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536782"/></marker></defs><rect x="10" y="20" width="330" height="285" rx="24" fill="#e8ecff"/><text x="30" y="53">AI application · HOST</text><rect x="32" y="77" width="286" height="83" rx="14" fill="white"/><text x="49" y="106">User experience + model</text><text x="49" y="133" class="svg-small">Interpret request · check host policy</text><rect x="32" y="193" width="286" height="78" rx="14" fill="white" stroke="#3155f5"/><text x="49" y="223">MCP CLIENT</text><text x="49" y="248" class="svg-small">Protocol messages for this server</text><path d="M175 160V192" stroke="#536782" stroke-width="2" marker-end="url(#mcp-arrow)"/><rect x="425" y="144" width="205" height="140" rx="20" fill="#e0f0e7"/><text x="445" y="177">MCP SERVER</text><text x="445" y="204" class="svg-small">Expose capabilities</text><text x="445" y="226" class="svg-small">Validate + authorize</text><text x="445" y="248" class="svg-small">Execute or delegate</text><rect x="717" y="144" width="173" height="140" rx="20" fill="#f9e7d0"/><text x="735" y="178">Data / API</text><text x="735" y="207" class="svg-small">File, database,</text><text x="735" y="229" class="svg-small">service or function</text><path d="M320 226H423M632 226H714" stroke="#536782" stroke-width="2" marker-start="url(#mcp-arrow)" marker-end="url(#mcp-arrow)"/><text x="355" y="199" class="svg-small">MCP</text><text x="645" y="199" class="svg-small">Adapter</text><text x="428" y="77" class="svg-small">One host may manage several clients.</text><text x="428" y="99" class="svg-small">Each client talks to a particular server.</text></svg><figcaption>The model's proposed action passes through application and server boundaries. This is a conceptual diagram, not a live connection.</figcaption></figure>
