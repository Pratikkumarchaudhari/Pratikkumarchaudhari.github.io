<figure class="mcp-diagram" tabindex="0" aria-label="MCP and RAG can be combined"><svg viewBox="0 0 900 245" role="img" aria-labelledby="mcp-rag-title mcp-rag-desc"><title id="mcp-rag-title">MCP can expose a retrieval operation used in a RAG workflow</title><desc id="mcp-rag-desc">An AI application sends a search request through an MCP client to a server. The server's implementation retrieves eligible policy passages. The returned evidence is used by the application to assemble context and generate a cited answer.</desc><defs><marker id="mcp-rag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536782"/></marker></defs><rect x="10" y="35" width="240" height="110" rx="18" fill="#e8ecff"/><text x="30" y="70">AI application</text><text x="30" y="101" class="svg-small">Question + MCP client</text><rect x="328" y="35" width="240" height="110" rx="18" fill="#e0f0e7"/><text x="348" y="70">MCP server</text><text x="348" y="101" class="svg-small">Expose search_policies</text><rect x="646" y="35" width="240" height="110" rx="18" fill="#f9e7d0"/><text x="666" y="70">Retrieval inside</text><text x="666" y="101" class="svg-small">Keyword, vector or hybrid</text><path d="M252 88H325M570 88H643" stroke="#536782" stroke-width="2" marker-start="url(#mcp-rag-arrow)" marker-end="url(#mcp-rag-arrow)"/><text x="25" y="190" class="svg-small">Returned passages → application builds context → model generates a supported answer</text><text x="25" y="218" class="svg-small">The protocol exposes the capability; the RAG design determines retrieval and grounding.</text></svg><figcaption>A possible integration, not a requirement. RAG can retrieve without MCP, and MCP can expose tools unrelated to RAG.</figcaption></figure>
