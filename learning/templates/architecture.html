<figure tabindex="0" aria-label="RAG architecture diagram, scroll horizontally on small screens" class="architecture-figure">
<svg viewBox="0 0 920 398" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Two paths through a vector-based RAG system</title><desc id="architecture-desc">Indexing: documents go to chunks, embeddings, then a vector store. Answering: a question is embedded, matching passages are retrieved from the store, the prompt combines question and evidence, and a generator writes an answer with citations.</desc>
<defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536782"/></marker></defs>
<rect x="8" y="8" width="904" height="164" rx="24" fill="#eef0ff"/><rect x="8" y="218" width="904" height="172" rx="24" fill="#eaf5f0"/>
<text x="28" y="39" class="svg-label">PREPARE THE LIBRARY · INDEXING</text><text x="28" y="249" class="svg-label">ANSWER A QUESTION · RUNTIME</text>
<g fill="none" stroke="#536782" stroke-width="2" marker-end="url(#arch-arrow)"><path d="M203 110H249"/><path d="M425 110H471"/><path d="M647 110H693"/><path d="M203 321H249"/><path d="M425 321H471"/><path d="M647 321H693"/><path d="M784 152V194H340V275"/></g>
<text x="440" y="187" class="svg-small">Stored evidence is searched when a question arrives</text>
<g data-node="0"><rect x="28" y="67" width="175" height="86" rx="15"/><text x="45" y="97">01 · Documents</text><text x="45" y="126" class="svg-small">Read useful text</text></g>
<g data-node="1"><rect x="250" y="67" width="175" height="86" rx="15"/><text x="267" y="97">02 · Chunks</text><text x="267" y="126" class="svg-small">Keep meaning together</text></g>
<g data-node="2"><rect x="472" y="67" width="175" height="86" rx="15"/><text x="489" y="97">03 · Embeddings</text><text x="489" y="126" class="svg-small">Represent with numbers</text></g>
<g data-node="3"><rect x="694" y="67" width="198" height="86" rx="15"/><text x="711" y="97">04 · Vector store</text><text x="711" y="126" class="svg-small">Vectors + source links</text></g>
<g data-node="4"><rect x="28" y="276" width="175" height="86" rx="15"/><text x="45" y="306">05 · Question</text><text x="45" y="335" class="svg-small">Embed the query</text></g>
<g data-node="5"><rect x="250" y="276" width="175" height="86" rx="15"/><text x="267" y="306">06 · Retrieval</text><text x="267" y="335" class="svg-small">Find useful passages</text></g>
<g data-node="6"><rect x="472" y="276" width="175" height="86" rx="15"/><text x="489" y="306">07 · Prompt</text><text x="489" y="335" class="svg-small">Question + evidence</text></g>
<g data-node="7"><rect x="694" y="276" width="198" height="86" rx="15"/><text x="711" y="306">08 · Answer</text><text x="711" y="335" class="svg-small">Generate + cite sources</text></g></svg>
<figcaption>One common architecture. Text, source metadata and permission checks accompany the vectors. Retrieval need not be vector-based.</figcaption></figure>
<div class="lab architecture-lab" data-lab="architecture"><p class="lab-label">Explore each step</p><div class="step-controls"><button type="button" data-step="0" aria-pressed="true">1. Read</button><button type="button" data-step="1" aria-pressed="false">2. Split</button><button type="button" data-step="2" aria-pressed="false">3. Embed</button><button type="button" data-step="3" aria-pressed="false">4. Store</button><button type="button" data-step="4" aria-pressed="false">5. Ask</button><button type="button" data-step="5" aria-pressed="false">6. Retrieve</button><button type="button" data-step="6" aria-pressed="false">7. Augment</button><button type="button" data-step="7" aria-pressed="false">8. Generate</button></div><div class="step-story" aria-live="polite"><h3 id="step-title">1. Read the documents</h3><p id="step-description">Extract readable text and keep its source information. For a scanned PDF, this may include OCR. Bad extraction cannot be repaired simply by choosing a larger model.</p></div><noscript>The labeled diagram and explanations in this guide remain readable without JavaScript.</noscript></div>
