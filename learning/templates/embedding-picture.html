<figure tabindex="0" aria-label="Conceptual embedding map, scroll horizontally on small screens" class="embedding-figure"><svg viewBox="0 0 760 320" role="img" aria-labelledby="embedding-title embedding-desc"><title id="embedding-title">An illustrative map of meaning</title><desc id="embedding-desc">Approval and authorization sit near each other, while retention and error correction sit elsewhere. This is a hand-drawn teaching map, not a projection of real embeddings.</desc><rect width="760" height="320" rx="24" fill="#f3f2ed"/><path d="M55 265H710M55 265V35" stroke="#bdc4d2" stroke-width="2"/><circle cx="200" cy="106" r="72" fill="#e0e5ff"/><circle cx="420" cy="206" r="50" fill="#dceee3"/><circle cx="607" cy="100" r="50" fill="#f9e4cb"/><g fill="#3155f5"><circle cx="150" cy="96" r="6"/><circle cx="175" cy="134" r="6"/></g><text x="165" y="86">approve access</text><text x="190" y="153">authorize a request</text><circle cx="400" cy="196" r="6" fill="#237058"/><text x="415" y="219">retention period</text><circle cx="588" cy="88" r="6" fill="#9e6628"/><text x="600" y="117">fix errors</text><text x="78" y="293" class="svg-small">Conceptual 2D picture · no real embedding coordinates or named dimensions</text></svg><figcaption>Related wording can occupy a nearby region in a useful representation. Real embeddings usually have many dimensions, and their geometry depends on the model and data.</figcaption></figure>
